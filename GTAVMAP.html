<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V Map Tool - by Sitzheizung</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1115;
            --sidebar-bg: rgba(20, 24, 30, 0.95);
            --accent: #af05da;
            --text-main: #e0e6ed;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --tab-active: rgba(193, 7, 240, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            min-width: 260px;
            height: 100vh;
            background: var(--sidebar-bg);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            z-index: 2000;
            box-shadow: 10px 0 25px rgba(0, 0, 0, 0.5);
        }

        .sidebar-header {
            padding: 24px 16px 8px 16px;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-family: 'Outfit', sans-serif;
            color: var(--accent);
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .map-type-selector {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
        }

        .map-type-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 4px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            text-align: center;
        }

        .map-type-btn:hover {
            background: rgba(193, 7, 240, 0.1);
            border-color: var(--accent);
            color: var(--text-main);
        }

        .map-type-btn.active {
            background: rgba(193, 7, 240, 0.2);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 10px rgba(175, 5, 218, 0.2);
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            letter-spacing: 1px;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: var(--tab-active);
        }

        .tab-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0 16px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .drag-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 12px;
            margin-bottom: 12px;
            cursor: grab;
            border-radius: 12px;
            text-align: center;
            color: var(--text-main);
            font-size: 13px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .drag-item:hover {
            background: rgba(193, 7, 240, 0.15);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(193, 7, 240, 0.15);
        }

        .drag-item .drag-emoji {
            font-size: 24px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .marker-list-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .marker-list-item:hover {
            background: rgba(193, 7, 240, 0.15);
            border-color: var(--accent);
        }

        .marker-list-item .list-emoji {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }

        .marker-info {
            flex-grow: 1;
            min-width: 0;
        }

        .marker-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .marker-coords {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .btn-danger {
            color: #ff5555;
        }

        .btn-danger:hover {
            background: rgba(255, 85, 85, 0.1);
            border-color: #ff5555;
        }

        #map-container {
            flex-grow: 1;
            height: 100vh;
            background: #000;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #000;
        }

        .leaflet-image-layer {
            image-rendering: high-quality;
        }

        .leaflet-popup-content-wrapper {
            background: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 4px;
        }

        .leaflet-popup-tip {
            background: var(--bg-dark);
        }

        .popup-header {
            color: var(--accent);
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 6px;
        }

        .popup-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .hint {
            font-size: 10px;
            color: #555;
            margin-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 6px;
        }

        /* Custom Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #14181e;
            border: 1px solid var(--accent);
            border-radius: 14px;
            padding: 24px;
            min-width: 320px;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(175, 5, 218, 0.15);
        }

        .modal-title {
            color: var(--accent);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-input {
            width: 100%;
            padding: 10px 12px;
            background: #070a10;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        .modal-input:focus {
            border-color: var(--accent);
        }

        .modal-msg {
            color: var(--text-main);
            font-size: 13px;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .modal-btns {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .modal-btn-primary:hover {
            background: #c520e8;
        }
    </style>
</head>

<body>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle"></div>
            <div id="modalBody"></div>
            <div class="modal-btns" id="modalBtns"></div>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">GTA V Map Tool </div>
            <div class="map-type-selector">
                <button class="map-type-btn" data-map="gta_map_roadmap.png"
                    onclick="switchMapType(this)">Roadmap</button>
                <button class="map-type-btn active" data-map="gta_map.png"
                    onclick="switchMapType(this)">Standard</button>
                <button class="map-type-btn" data-map="gta_map_satellite.png"
                    onclick="switchMapType(this)">Satellite</button>
            </div>
            <div class="tabs">
                <button id="btn-tab-icons" class="tab-btn active" onclick="switchTab('tab-icons')">Icons</button>
                <button id="btn-tab-list" class="tab-btn" onclick="switchTab('tab-list')">Liste</button>
            </div>
        </div>

        <div id="tab-icons" class="tab-content active"></div>

        <div id="tab-list" class="tab-content">
            <div id="marker-list"></div>
        </div>

        <div class="sidebar-footer">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button class="btn" onclick="exportData()" title="Markierungen als JSON exportieren">💾 Export</button>
                <button class="btn" onclick="importData()" title="Markierungen aus JSON importieren">📂 Import</button>
            </div>
            <button class="btn btn-danger" onclick="clearAll()">🗑️ Marker löschen</button>
        </div>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Modal helpers (replace prompt/confirm/alert for iframe compatibility)
        function openModal(title, bodyHTML, btnsHTML) {
            const m = document.getElementById('customModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;
            document.getElementById('modalBtns').innerHTML = btnsHTML;
            m.classList.add('active');
            const firstInput = m.querySelector('.modal-input');
            if (firstInput) setTimeout(() => firstInput.focus(), 50);
        }
        function closeModal() { document.getElementById('customModal').classList.remove('active'); }

        function showModal(title, fields, onSubmit) {
            let body = fields.map(f =>
                `<label style="display:block;font-size:11px;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;">${f.label}</label>
                 <input class="modal-input" id="${f.id}" placeholder="${f.label}">`
            ).join('');
            openModal(title, body,
                `<button class="modal-btn" onclick="closeModal()">Abbrechen</button>
                 <button class="modal-btn modal-btn-primary" id="modalOk">OK</button>`);
            document.getElementById('modalOk').onclick = () => {
                const values = {};
                fields.forEach(f => values[f.id] = document.getElementById(f.id).value);
                closeModal();
                onSubmit(values);
            };
            // Enter key submits
            fields.forEach(f => {
                document.getElementById(f.id).addEventListener('keydown', e => {
                    if (e.key === 'Enter') document.getElementById('modalOk').click();
                });
            });
        }

        function showConfirm(msg, onYes) {
            openModal('Bestätigung', `<div class="modal-msg">${msg}</div>`,
                `<button class="modal-btn" onclick="closeModal()">Abbrechen</button>
                 <button class="modal-btn modal-btn-primary" id="modalYes">Ja</button>`);
            document.getElementById('modalYes').onclick = () => { closeModal(); onYes(); };
        }

        function showAlert(msg) {
            openModal('Info', `<div class="modal-msg">${msg}</div>`,
                `<button class="modal-btn modal-btn-primary" onclick="closeModal()">OK</button>`);
        }

        const mapSize = 8192;
        const iconTypes = {
            "Standard": { emoji: "📍", name: "Standard", defaultColor: "#af05da" },
            "Finanzen": { emoji: "💰", name: "Finanzen", defaultColor: "#00ff88" },
            "Arsenal": { emoji: "🔫", name: "Waffen", defaultColor: "#ff5555" },
            "Drogen": { emoji: "💊", name: "Drogen", defaultColor: "#9d00ff" },
            "Kiste": { emoji: "📦", name: "Kiste", defaultColor: "#ffaa00" },
            "Auto": { emoji: "🚗", name: "Auto", defaultColor: "#00d4ff" },
            "Hood": { emoji: "🏚️", name: "Hood / Anwesen", defaultColor: "#ff69b4" },
            "Weed": { emoji: "🌿", name: "Weed", defaultColor: "#32cd32" },
            "Meth": { emoji: "🧪", name: "Meth", defaultColor: "#00ffff" },
            "MagicMushroom": { emoji: "🍄", name: "Magic Mushroom", defaultColor: "#ff00ff" },
            "Amphetamine": { emoji: "💊", name: "Amphetamine", defaultColor: "#ff8800" },
            "Kokain": { emoji: "❄️", name: "Kokain", defaultColor: "#ffffff" },
            "Diamanten": { emoji: "💎", name: "Diamanten", defaultColor: "#00e6ff" },
            "Raeube": { emoji: "🕶️", name: "Räube", defaultColor: "#ff0033" },
            "Strom": { emoji: "⚡", name: "Strom", defaultColor: "#ffff00" },
            "Schwarzmarkt": { emoji: "🕵️‍♂️", name: "Schwarzmarkt", defaultColor: "#b30000" },
            "Kameras": { emoji: "📷", name: "Kameras", defaultColor: "#8888ff" }
        };
        // Backward compat: map old keys to new
        const iconKeyAlias = { "Geld": "Finanzen", "Waffe": "Arsenal" };
        function resolveIconKey(key) { return iconKeyAlias[key] || (iconTypes[key] ? key : "Standard"); }

        function makeEmojiIcon(iconKey) {
            const cfg = iconTypes[iconKey] || iconTypes["Standard"];
            return L.divIcon({
                className: '',
                html: `<div style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:${cfg.defaultColor}33;border:2px solid ${cfg.defaultColor};font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,0.4);">${cfg.emoji}</div>`,
                iconSize: [28, 28],
                iconAnchor: [14, 14],
                popupAnchor: [0, -14]
            });
        }

        // Generate sidebar icons dynamically
        (function buildSidebar() {
            const container = document.getElementById('tab-icons');
            Object.keys(iconTypes).forEach(key => {
                const cfg = iconTypes[key];
                const div = document.createElement('div');
                div.className = 'drag-item';
                div.draggable = true;
                div.setAttribute('data-type', key);
                div.innerHTML = `<span class="drag-emoji">${cfg.emoji}</span> ${cfg.name}`;
                div.addEventListener('dragstart', (e) => { draggedType = e.target.closest('.drag-item').getAttribute('data-type'); });
                container.appendChild(div);
            });
        })();
        const STORAGE_KEY = 'gtav_map_markers_v3';
        const PRESET_MARKERS = []; // DO NOT REMOVE: Injection point for full backup
        let markersObjects = [];

        // 1. Map Setup
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -3, maxZoom: 2,
            attributionControl: false, zoomSnap: 0.1
        });

        var bounds = [[0, 0], [mapSize, mapSize]];
        var currentOverlay = L.imageOverlay('gta_map.png', bounds).addTo(map);
        map.fitBounds(bounds);

        setTimeout(() => { map.invalidateSize(); map.fitBounds(bounds); }, 300);

        // Map type switching
        function switchMapType(btn) {
            document.querySelectorAll('.map-type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const newUrl = btn.getAttribute('data-map');
            map.removeLayer(currentOverlay);
            currentOverlay = L.imageOverlay(newUrl, bounds).addTo(map);
            currentOverlay.bringToBack();
        }

        // Listen for parent iframe messages
        window.addEventListener('message', function (e) {
            if (e.data === 'invalidateMap') {
                setTimeout(() => { map.invalidateSize(); }, 100);
            }
        });

        // 2. Tab Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('active');
            if (tabId === 'tab-list') renderList();
        }

        // 3. Marker Logic
        function createMarker(lat, lng, title, desc, iconKey, save = true) {
            const key = resolveIconKey(iconKey);
            const customIcon = makeEmojiIcon(key);

            const marker = L.marker([lat, lng], { icon: customIcon, draggable: true }).addTo(map);
            marker._iconKey = key;
            marker.bindPopup(`
            <div style="min-width:180px">
                <div class="popup-header">${title}</div>
                <div class="popup-desc">${desc || 'Keine Beschreibung'}</div>
                <span class="hint">Shift + Klick zum Löschen</span>
            </div>
        `);

            marker.on('mousedown', (e) => {
                if (e.originalEvent.shiftKey) { map.removeLayer(marker); updateStorage(); }
            });
            marker.on('dragend', updateStorage);
            if (save) updateStorage();
            return marker;
        }

        // 4. List Interaction
        function renderList() {
            const list = document.getElementById('marker-list');
            list.innerHTML = '';

            const currentMarkers = [];
            map.eachLayer(layer => {
                if (layer instanceof L.Marker) {
                    const pos = layer.getLatLng();
                    const ik = layer._iconKey || "Standard";
                    const popup = layer.getPopup().getContent();
                    const div = document.createElement('div'); div.innerHTML = popup;
                    const title = div.querySelector('.popup-header')?.innerText || "Marker";
                    currentMarkers.push({ lat: pos.lat, lng: pos.lng, title, iconKey: ik });
                }
            });

            currentMarkers.forEach(m => {
                const item = document.createElement('div');
                item.className = 'marker-list-item';
                item.onclick = () => { map.setView([m.lat, m.lng], 1); };
                const cfg = iconTypes[m.iconKey] || iconTypes["Standard"];
                item.innerHTML = `
                <span class="list-emoji">${cfg.emoji}</span>
                <div class="marker-info">
                    <div class="marker-name">${m.title}</div>
                    <div class="marker-coords">${Math.round(m.lat)}, ${Math.round(m.lng)}</div>
                </div>
            `;
                list.appendChild(item);
            });

            if (currentMarkers.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:40px 10px; color:var(--text-muted); font-size:12px;">Keine Markierungen vorhanden.</div>';
            }
        }

        // 5. Drag & Drop
        let draggedType = null;

        const mapDiv = document.getElementById('map');
        mapDiv.addEventListener('dragover', (e) => e.preventDefault());
        mapDiv.addEventListener('drop', (e) => {
            e.preventDefault();
            const point = map.mouseEventToLatLng(e);
            promptUser(point.lat, point.lng, draggedType);
        });

        map.on('dblclick', (e) => { promptUser(e.latlng.lat, e.latlng.lng, "Standard"); });
        map.doubleClickZoom.disable();

        function promptUser(lat, lng, type) {
            showModal('Neue Markierung', [
                { label: 'Name der Markierung:', id: 'mName', required: true },
                { label: 'Beschreibung (optional):', id: 'mDesc' }
            ], (values) => {
                if (values.mName) createMarker(lat, lng, values.mName, values.mDesc, type);
            });
        }

        // 6. Data Management
        function updateStorage() {
            const data = [];
            map.eachLayer(layer => {
                if (layer instanceof L.Marker) {
                    const pos = layer.getLatLng();
                    const iconKey = layer._iconKey || "Standard";
                    const popup = layer.getPopup().getContent();
                    const div = document.createElement('div'); div.innerHTML = popup;
                    const title = div.querySelector('.popup-header')?.innerText || "Marker";
                    const desc = div.querySelector('.popup-desc')?.innerText || "";
                    data.push({ lat: pos.lat, lng: pos.lng, title, desc, iconKey });
                }
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            if (document.getElementById('tab-list').classList.contains('active')) renderList();
        }

        function clearAll() {
            showConfirm('Wirklich alle Markierungen löschen?', () => {
                map.eachLayer(layer => { if (layer instanceof L.Marker) map.removeLayer(layer); });
                updateStorage();
            });
        }

        function exportData() {
            const data = getCurrentMarkers();
            const jsonStr = JSON.stringify(data, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(jsonStr);
            const a = document.createElement('a');
            a.href = dataUri;
            a.download = 'gtav_marks.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.style.display = 'none';
            document.body.appendChild(input);
            input.onchange = (e) => {
                const file = e.target.files[0];
                document.body.removeChild(input);
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (!Array.isArray(data)) throw new Error('Ungültiges Format');

                        // Merge logic
                        const currentMarkers = getCurrentMarkers();
                        const markerMap = new Map();

                        // Add existing markers to map
                        currentMarkers.forEach(m => {
                            const key = `${m.lat},${m.lng},${m.title}`;
                            markerMap.set(key, m);
                        });

                        // Add imported markers to map (can overwrite)
                        data.forEach(m => {
                            if (m.lat !== undefined && m.lng !== undefined && m.title) {
                                const key = `${m.lat},${m.lng},${m.title}`;
                                markerMap.set(key, m);
                            }
                        });

                        // Clear current markers from map
                        map.eachLayer(layer => { if (layer instanceof L.Marker) map.removeLayer(layer); });

                        // Re-create all markers
                        markerMap.forEach(m => createMarker(m.lat, m.lng, m.title, m.desc, m.iconKey, false));

                        // Update storage and UI
                        updateStorage();
                        showAlert(`${data.length} Markierungen erfolgreich importiert/aktualisiert.`);
                    } catch (err) {
                        showAlert('Fehler beim Importieren: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function getCurrentMarkers() {
            const data = [];
            map.eachLayer(layer => {
                if (layer instanceof L.Marker) {
                    const pos = layer.getLatLng();
                    const iconKey = layer._iconKey || "Standard";
                    const popup = layer.getPopup().getContent();
                    const div = document.createElement('div'); div.innerHTML = popup;
                    const title = div.querySelector('.popup-header')?.innerText || "Marker";
                    const desc = div.querySelector('.popup-desc')?.innerText || "";
                    data.push({ lat: pos.lat, lng: pos.lng, title, desc, iconKey });
                }
            });
            return data;
        }



        window.onload = () => {
            const localSaved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

            // Use a Map to avoid duplicates by position and title
            const allMarkers = new Map();

            // Priority 1: Preset markers (the ones baked into the file)
            PRESET_MARKERS.forEach(m => {
                const key = `${m.lat},${m.lng},${m.title}`;
                allMarkers.set(key, m);
            });

            // Priority 2: Local storage markers (can override or add new ones)
            localSaved.forEach(m => {
                const key = `${m.lat},${m.lng},${m.title}`;
                allMarkers.set(key, m);
            });

            allMarkers.forEach(m => createMarker(m.lat, m.lng, m.title, m.desc, m.iconKey, false));
        };
    </script>
</body>
