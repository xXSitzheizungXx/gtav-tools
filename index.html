<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V Tools Hub - by Sitzheizung</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --nav-bg: rgba(15, 17, 21, 0.97);
            --accent: #af05da;
            --accent-blue: #00d4ff;
            --accent-red: #ff0055;
            --text-main: #e0e6ed;
            --text-muted: #6b7a8d;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100vh;
            width: 100vw;
            background: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ─── Top Navigation ─── */
        .top-nav {
            height: 56px;
            min-height: 56px;
            background: var(--nav-bg);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 0;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
        }

        .nav-brand {
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent), var(--accent-blue));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin-right: 32px;
            white-space: nowrap;
        }

        .nav-tabs {
            display: flex;
            height: 100%;
            gap: 2px;
        }

        .nav-tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0 24px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .nav-tab::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            right: 50%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-blue));
            border-radius: 3px 3px 0 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-tab:hover {
            color: var(--text-main);
        }

        .nav-tab:hover::after {
            left: 20%;
            right: 20%;
        }

        .nav-tab.active {
            color: #fff;
            text-shadow: 0 0 12px rgba(175, 5, 218, 0.4);
        }

        .nav-tab.active::after {
            left: 8px;
            right: 8px;
        }

        .nav-tab .tab-icon {
            font-size: 16px;
        }

        /* ─── View Container ─── */
        .view-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .view-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background: var(--bg-dark);
        }

        .view-frame.active {
            display: block;
        }
    </style>
</head>

<body>
    <nav class="top-nav">
        <div class="nav-brand">GTA V Tools</div>
        <div class="nav-tabs">
            <button class="nav-tab active" data-view="crafting" onclick="switchView('crafting')">
                <span class="tab-icon">🧪</span> Crafting Rechner
            </button>
            <button class="nav-tab" data-view="map" onclick="switchView('map')">
                <span class="tab-icon">🗺️</span> Map Tool
            </button>
        </div>
    </nav>

    <div class="view-container">
        <iframe id="view-crafting" class="view-frame active" src="Crafting_Rechner_neu.html"></iframe>
        <iframe id="view-map" class="view-frame" src="GTAVMAP.html"></iframe>
    </div>

    <script>
        function switchView(viewName) {
            // Update tabs
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.view === viewName);
            });

            // Update frames
            document.querySelectorAll('.view-frame').forEach(frame => {
                frame.classList.remove('active');
            });
            const targetFrame = document.getElementById('view-' + viewName);
            targetFrame.classList.add('active');

            // Tell map to resize if switching to map view
            if (viewName === 'map') {
                try {
                    targetFrame.contentWindow.postMessage('invalidateMap', '*');
                } catch (e) { }
            }
        }
    </script>
</body>

</html>
